<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub｜業務支援ツール</title>
<style>
  :root { --a:#0AB1B6; --ad:#078F93; --as:#E6F7F7; --border:#E4E8EC; --gray:#7A8494; --text:#1C242C; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--text); font-size:16px; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 28px 14px; max-width:1360px; margin:0 auto; }
  .logo { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:800; letter-spacing:.04em; }
  .logo::before { content:""; width:15px; height:32px; border-radius:8px; background:linear-gradient(180deg,var(--a),var(--ad)); }
  .hright { display:flex; align-items:center; gap:10px; }
  .company { font-size:15px; color:var(--gray); }
  .userbtn { display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:#fff; border-radius:99px; padding:7px 15px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--text); }
  .refbtn { border:1px solid var(--border); background:#fff; border-radius:99px; padding:7px 13px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ad); }
  nav { display:flex; gap:6px; padding:0 20px; border-bottom:1px solid #ECEFF2; max-width:1360px; margin:0 auto; overflow-x:auto; }
  nav button { display:flex; align-items:center; gap:8px; padding:14px 20px; background:none; border:none; border-bottom:3px solid transparent; font-size:17px; font-weight:700; color:#8A93A2; cursor:pointer; white-space:nowrap; font-family:inherit; }
  nav button.on { color:var(--ad); border-bottom-color:var(--a); }
  main { max-width:1360px; margin:0 auto; padding:24px 24px 40px; }
  footer { text-align:center; font-size:13px; color:#AEB7C0; padding:14px 20px 24px; }
  .toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--as); border:1px solid var(--a); color:var(--ad); font-size:15px; font-weight:700; border-radius:10px; padding:12px 20px; z-index:99; animation:fadeUp .3s ease; max-width:90%; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .toast.warn { background:#FBEEEE; border-color:#C24545; color:#8A3232; }
  @keyframes fadeUp { from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)} }
  .fade { animation:fu .3s ease; } @keyframes fu { from{opacity:0; transform:translateY(8px)} to{opacity:1} }
  .overlay { position:fixed; inset:0; background:rgba(20,30,40,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal { background:#fff; border-radius:18px; padding:26px 24px; max-width:420px; width:100%; }
  .modal h2 { margin:0 0 8px; font-size:19px; }
  .modal p { margin:0 0 16px; font-size:14px; color:var(--gray); line-height:1.7; }
  .memberbtn { display:block; width:100%; text-align:left; padding:13px 16px; border-radius:11px; border:1px solid var(--border); background:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; margin-bottom:8px; }
  .memberbtn:hover { border-color:var(--a); background:var(--as); }
  .demo { background:#FDF6EE; border:1px solid #EDD6B4; color:#9A6A1F; border-radius:10px; padding:10px 14px; font-size:13px; margin:0 auto 14px; max-width:1312px; }
  .home-layout { display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:start; }
  @media (max-width:860px) { .home-layout { grid-template-columns:1fr; } }
  .applist { display:flex; flex-direction:column; gap:14px; }
  .appbtn { display:flex; align-items:center; gap:16px; text-align:left; background:linear-gradient(135deg,#FDFEFE,#F4FAFA); border:1px solid var(--border); border-radius:20px; padding:18px 20px; cursor:pointer; font-family:inherit; color:inherit; transition:transform .15s, box-shadow .15s, border-color .15s; box-shadow:0 2px 8px rgba(28,36,44,.05); }
  .appbtn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(10,177,182,.18); border-color:var(--a); }
  .appbtn .icon { width:58px; height:58px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; background:linear-gradient(135deg,var(--a),var(--ad)); box-shadow:0 3px 8px rgba(10,177,182,.35); }
  .appbtn .nm { font-size:18px; font-weight:800; }
  .appbtn .ds { font-size:13px; color:var(--gray); margin-top:4px; line-height:1.6; }
  .appbtn .open { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .appbtn .open .num { font-size:30px; font-weight:800; color:var(--ad); line-height:1; }
  .appbtn .open .num small { font-size:13px; color:var(--gray); font-weight:700; }
  .appbtn .open .lbl { font-size:12px; font-weight:800; color:#fff; background:var(--a); border-radius:99px; padding:4px 12px; }
  .panel { background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin-bottom:16px; }
  .panel .ph { font-size:17px; font-weight:800; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .panel .more { font-size:13px; font-weight:700; color:var(--ad); background:none; border:none; cursor:pointer; font-family:inherit; }
  .srow { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #F1F4F6; font-size:16px; }
  .srow:last-child { border-bottom:none; }
  .srow b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .sub { font-size:13px; color:var(--gray); margin-left:auto; flex-shrink:0; }
  .pill { font-size:14px; font-weight:700; color:var(--ad); background:var(--as); border-radius:6px; padding:3px 10px; flex-shrink:0; }
  .split { display:grid; grid-template-columns:1fr 400px; gap:20px; align-items:start; }
  @media (max-width:960px) { .split { grid-template-columns:1fr; } }
  .side { background:#FAFBFC; border:1px solid var(--border); border-radius:16px; padding:16px; }
  .side .sh { font-size:15px; font-weight:800; color:var(--ad); letter-spacing:.06em; margin-bottom:10px; }
  .alertbox { background:#FDF6EE; border:1px solid #EDD6B4; border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .alertbox .h { font-size:15px; font-weight:800; color:#9A6A1F; margin-bottom:6px; }
  .arow { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid #F0E2C8; border-radius:8px; padding:12px 14px; margin-top:6px; font-size:16px; flex-wrap:wrap; }
  .arow .due { color:#C24545; font-size:14px; font-weight:700; }
  .addbtn { width:100%; padding:15px; border-radius:12px; border:1.5px dashed var(--a); background:#fff; color:var(--ad); font-size:16px; font-weight:700; cursor:pointer; margin-bottom:16px; font-family:inherit; }
  .form { background:#FAFBFC; border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
  .form .ft { font-size:16px; font-weight:800; margin-bottom:14px; }
  label { display:block; font-size:14px; font-weight:700; color:#5B6675; margin-bottom:14px; }
  .req { font-size:11px; color:#C24545; margin-left:5px; }
  input, select, textarea { display:block; width:100%; margin-top:6px; padding:11px 13px; border-radius:9px; border:1px solid #D8DEE4; font-size:16px; background:#fff; font-family:inherit; }
  input[type="checkbox"] { display:inline-block; width:18px; height:18px; margin:0 8px 0 0; padding:0; accent-color:var(--a); vertical-align:middle; }
  .chk { display:flex; align-items:center; font-size:15px; font-weight:700; color:#2A3540; margin-bottom:14px; cursor:pointer; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--a); box-shadow:0 0 0 3px var(--as); }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .prim { padding:12px 26px; border-radius:9px; border:none; background:var(--a); color:#fff; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; }
  .ghost { padding:11px 18px; border-radius:9px; border:1px solid #D8DEE4; background:#fff; color:#5B6675; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .mini { border:1px solid #D8DEE4; background:#fff; color:#8A93A2; border-radius:8px; padding:6px 14px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .miniA { border:1px solid var(--a); background:#fff; color:var(--ad); border-radius:8px; padding:6px 14px; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; margin-bottom:12px; overflow:hidden; }
  .chead { display:flex; align-items:center; gap:12px; width:100%; padding:16px 18px; background:none; border:none; cursor:pointer; font-family:inherit; color:inherit; }
  .chead .title { flex:1; text-align:left; font-weight:700; font-size:17px; }
  .tag { font-size:13px; font-weight:800; border-radius:6px; padding:4px 10px; flex-shrink:0; }
  .tagP { color:#9A6A1F; background:#FDF3E3; } .tagD { color:var(--ad); background:var(--as); }
  .meta { font-size:14px; color:var(--gray); margin-bottom:10px; }
  .cand { display:flex; align-items:center; gap:10px; border:1px solid #ECEFF2; border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .cand.best { border:1.5px solid var(--a); background:var(--as); }
  .besttag { font-size:11px; font-weight:800; color:#fff; background:var(--a); border-radius:5px; padding:2px 8px; margin-left:8px; }
  .confirm { padding:10px 15px; border-radius:8px; border:none; background:var(--a); color:#fff; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .confirm:disabled { background:#C9D1D8; cursor:not-allowed; }
  .urlrow { display:flex; gap:8px; margin:8px 0 12px; }
  .urlrow input { margin-top:0; flex:1; background:#F6F8FA; font-size:13px; }
  .rstat { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .rchip { font-size:13px; font-weight:700; border-radius:99px; padding:4px 12px; }
  .rchip.ok { background:var(--as); color:var(--ad); }
  .rchip.wait { background:#F1F4F6; color:#8A93A2; }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calhead b { font-size:17px; }
  .arr { width:38px; height:38px; border-radius:9px; border:1px solid #D8DEE4; background:#fff; font-size:19px; cursor:pointer; color:var(--ad); }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; border:1px solid var(--border); border-radius:14px; padding:10px; margin-bottom:14px; background:#fff; }
  .calw { text-align:center; font-size:12px; font-weight:800; padding:4px 0; color:var(--gray); }
  .calw.sun { color:#C24545; } .calw.sat { color:#3D6BA8; }
  .cell { aspect-ratio:1; border:none; background:none; border-radius:9px; font-size:15px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text); font-family:inherit; }
  .cell.today { background:var(--as); font-weight:800; color:var(--ad); }
  .cell.sel { background:var(--a); color:#fff; font-weight:800; }
  .dots { display:flex; gap:2px; } .dot { width:5px; height:5px; border-radius:50%; background:var(--a); }
  .cell.sel .dot { background:#fff; }
  .dayhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .dayhead b { font-size:16px; }
  .sp { padding:9px 16px; border-radius:8px; border:none; background:var(--a); color:#fff; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
  .empty { border:1px solid var(--border); border-radius:12px; padding:24px; text-align:center; font-size:15px; color:#8A93A2; background:#fff; }
  .ev { display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:8px; background:#fff; }
  .ev .time { font-size:14px; font-weight:800; color:var(--ad); white-space:nowrap; }
  .ev .body { flex:1; min-width:0; }
  .ev .name { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .autotag { font-size:11px; font-weight:800; color:var(--ad); background:var(--as); border-radius:5px; padding:2px 8px; }
  .whotag { font-size:12px; font-weight:800; color:#5B6675; background:#F1F4F6; border-radius:5px; padding:2px 9px; }
  .ev .place { font-size:14px; color:var(--gray); margin-top:3px; }
  .btncol { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .seclabel { font-size:13px; font-weight:800; color:#8A93A2; letter-spacing:.1em; margin:4px 0 10px; }
  .task { display:flex; align-items:flex-start; gap:12px; padding:15px 17px; }
  .task.done { opacity:.55; } .task.done .tname { text-decoration:line-through; }
  .badge { font-size:13px; font-weight:800; border-radius:7px; padding:6px 11px; white-space:nowrap; flex-shrink:0; margin-top:2px; }
  .tname { font-size:17px; font-weight:700; }
  .tmeta { font-size:14px; color:var(--gray); margin-top:3px; }
  .tmemo { font-size:14px; color:var(--gray); margin-top:5px; background:#F6F8FA; border-radius:7px; padding:7px 10px; line-height:1.6; }
  .nl { font-size:13px; font-weight:800; color:var(--ad); letter-spacing:.08em; margin:10px 0 4px; }
  .nb { font-size:15px; line-height:1.8; color:#2A3540; }
  .todo-line { display:flex; gap:8px; margin-bottom:8px; }
  .todo-line input:first-child { flex:1; margin-top:0; } .todo-line input:last-child { width:160px; margin-top:0; }
  .note-small { font-size:13px; color:#AEB7C0; line-height:1.7; margin-top:6px; }
  .loading { text-align:center; color:var(--gray); padding:60px 0; font-size:16px; }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="tab='home';render()" style="cursor:pointer" title="ホームに戻る">WorkHub</div>
  <div class="hright">
    <span class="company" id="companyName"></span>
    <button class="refbtn" onclick="reloadData()" title="最新の状態に更新">↻ 更新</button>
    <button class="userbtn" id="userBtn" onclick="showUserPicker()">👤 −</button>
  </div>
</header>
<div id="demoBar"></div>
<nav id="nav"></nav>
<main id="main"><div class="loading">読み込んでいます…</div></main>
<footer>WorkHub ｜ Powered by Kiasu Co., Ltd.</footer>

<script>
"use strict";
// ================================================================
// ▼▼▼ 納品用設定（顧客ごとにここだけ変更してください） ▼▼▼
// ================================================================
const CONFIG = {
  companyName: "",                       // 例）"株式会社サンプル"
  gasUrl: "",                            // GASのウェブアプリURL（設置手順書 手順3）
  answerUrl: "",                         // answer.htmlの公開URL（例）"https://xxx.github.io/workhub/answer.html"
};
// ================================================================
// ▲▲▲ 設定はここまで ▲▲▲
// ================================================================

document.getElementById("companyName").textContent = CONFIG.companyName;
const REMOTE = !!CONFIG.gasUrl;

// ================= ユーティリティ =================
const KEY = "workhub_local_v1";
const pad = n => String(n).padStart(2,"0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (base,n) => { const d=new Date(base); d.setDate(d.getDate()+n); return toISO(d); };
const WD=["日","月","火","水","木","金","土"];
const fmtMD = iso => { if(!iso) return ""; const d=new Date(iso+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const daysUntil = iso => Math.round((new Date(iso+"T00:00:00")-today())/86400000);
const MARK={"○":2,"△":1,"×":0};
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T = today();

// ================= データ層（GAS連携／未設定時はこのPC内に保存） =================
let S = { events:[], tasks:[], notes:[], adjustments:[], members:[] };
let CURRENT_USER = localStorage.getItem("workhub_user") || "";

function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

async function apiPost(body){
  const r = await fetch(CONFIG.gasUrl, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(body) });
  return r.json();
}

function persist(type, item){
  if(!REMOTE){ saveLocal(); return; }
  apiPost({action:"upsert", type, item})
    .then(r=>{ if(!r.ok) throw 0; })
    .catch(()=>notify("保存に失敗しました。通信環境をご確認のうえ「↻ 更新」を押してください", true));
}
function removeIt(type, id){
  if(!REMOTE){ saveLocal(); return; }
  apiPost({action:"delete", type, id})
    .then(r=>{ if(!r.ok) throw 0; })
    .catch(()=>notify("削除の保存に失敗しました。通信環境をご確認ください", true));
}

async function reloadData(){
  if(!REMOTE){ render(); notify("最新の状態です"); return; }
  try{
    const r = await fetch(`${CONFIG.gasUrl}?action=all`);
    const data = await r.json();
    S = { events:data.events||[], tasks:data.tasks||[], notes:data.notes||[], adjustments:data.adjustments||[], members:data.members||[] };
    render();
    notify("最新の状態に更新しました");
  }catch(e){
    notify("データの取得に失敗しました。通信環境をご確認ください", true);
  }
}

function resetLocalData(){
  if(!confirm("このPCに保存されたすべての入力データ（予定・タスク・議事録・日程調整・名前）を消去します。よろしいですか？")) return;
  localStorage.removeItem(KEY);
  localStorage.removeItem("workhub_user");
  location.reload();
}

async function boot(){
  if(REMOTE){
    try{
      const r = await fetch(`${CONFIG.gasUrl}?action=all`);
      const data = await r.json();
      S = { events:data.events||[], tasks:data.tasks||[], notes:data.notes||[], adjustments:data.adjustments||[], members:data.members||[] };
    }catch(e){
      document.getElementById("main").innerHTML =
        `<div class="empty">データの読み込みに失敗しました。<br>通信環境をご確認のうえ、ページを再読み込みしてください。</div>`;
      return;
    }
  } else {
    try{ S = JSON.parse(localStorage.getItem(KEY)) || S; }catch(e){}
    document.getElementById("demoBar").innerHTML =
      `<div class="demo" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span>⚠ 現在「お試しモード」です（データはこのPC内のみに保存）。社内共有・回答URL機能を使うには、設置手順書に沿ってGASのURLを設定してください。</span>
        <button onclick="resetLocalData()" style="border:1px solid #C99A4B;background:#fff;color:#9A6A1F;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0">入力データを消去</button>
      </div>`;
  }
  if(!CURRENT_USER) showUserPicker(true);
  else registerMember();
  updateUserBtn();
  render();
}

// 利用者を共有名簿に登録（共有先プルダウンの選択肢になる）
function registerMember(){
  if(!CURRENT_USER) return;
  S.members = S.members||[];
  if(!S.members.find(m=>m.name===CURRENT_USER)){
    const m={id:CURRENT_USER, name:CURRENT_USER};
    S.members.push(m);
    persist("members", m);
  }
}
// 共有先候補（自分以外）。名簿＋データ上の名前を統合
function memberNames(){
  const set=new Set((S.members||[]).map(m=>m.name));
  [...S.events,...S.tasks,...S.notes,...S.adjustments].forEach(it=>{
    if(it.createdBy) set.add(it.createdBy);
    if(it.author) set.add(it.author);
    if(it.assignee) set.add(it.assignee);
  });
  set.delete(CURRENT_USER); set.delete("");
  return [...set].sort();
}

function updateUserBtn(){ document.getElementById("userBtn").textContent = `👤 ${CURRENT_USER||"−"}`; }

function showUserPicker(first){
  const ov = document.createElement("div");
  ov.className = "overlay";
  const parts = (CURRENT_USER||"").split(" ");
  ov.innerHTML = `<div class="modal">
    <h2>お名前を入力してください</h2>
    <p>フルネームで入力してください。タスクの担当者や議事録の作成者として表示されます。${first?"（次回からは自動で表示されます）":""}</p>
    <div class="row" style="margin-bottom:14px">
      <label style="margin-bottom:0">姓<input id="up_sei" placeholder="例）山田" value="${esc(parts[0]||"")}"></label>
      <label style="margin-bottom:0">名<input id="up_mei" placeholder="例）太郎" value="${esc(parts[1]||"")}"></label>
    </div>
    <button class="prim" id="up_start" style="width:100%">はじめる</button>
  </div>`;
  ov.querySelector("#up_start").addEventListener("click", ()=>{
    const sei = ov.querySelector("#up_sei").value.trim();
    const mei = ov.querySelector("#up_mei").value.trim();
    if(!sei || !mei){ notify("姓と名の両方を入力してください", true); return; }
    CURRENT_USER = `${sei} ${mei}`;
    localStorage.setItem("workhub_user", CURRENT_USER);
    registerMember();
    updateUserBtn();
    ov.remove();
    render();
  });
  document.body.appendChild(ov);
}

function notify(msg, warn){

  const el=document.createElement("div");
  el.className="toast"+(warn?" warn":""); el.textContent=(warn?"⚠ ":"✓ ")+msg;

}

// ================= 共有制御 =================
// 表示ルール：自分が作成した / 共有ONにされた / 自分が担当者、のいずれかなら見える
function canSee(it){
  // 議事録から登録されたタスクは、担当者本人の画面にのみ表示する
  if(it.from==="note" && it.assignee) return it.assignee===CURRENT_USER;
  if(!it.createdBy) return true;                 // 旧データは全員に表示（互換）
  if(it.createdBy===CURRENT_USER) return true;   // 自分が作成
  const mode = it.shareMode!==undefined ? it.shareMode : (it.shared ? "all" : "none");
  if(mode==="all") return true;                          // 全員に共有
  if(mode==="select" && (it.shareWith||[]).includes(CURRENT_USER)) return true; // 選ばれた人
  if(it.assignee && it.assignee===CURRENT_USER) return true; // 自分が担当
  if((it.participants||[]).includes(CURRENT_USER)) return true; // 会議の参加者（議事録は出席者に自動共有）
  return false;
}
function visEvents(){ return S.events.filter(canSee); }
function visTasks(){ return S.tasks.filter(canSee); }
function visNotes(){ return S.notes.filter(canSee); }
function visAdjs(){ return S.adjustments.filter(canSee); }
function shareTag(it){
  const mode = it.shareMode!==undefined ? it.shareMode : (it.shared ? "all" : "none");
  if(mode==="all") return `<span class="autotag">共有:全員</span>`;
  if(mode==="select") return `<span class="autotag">共有:${esc((it.shareWith||[]).join("、"))}</span>`;
  return "";
}
// 共有範囲の入力部品：登録済みメンバーの氏名を直接プルダウンに表示
function shareControlHtml(prefix, defSel){
  const names=memberNames();
  const sel=defSel||"none";
  return `<label>共有範囲
    <select id="${prefix}_mode">
      <option value="none" ${sel==="none"?"selected":""}>自分のみ</option>
      <option value="all" ${sel==="all"?"selected":""}>全員</option>
      ${names.map(n=>`<option value="${esc(n)}" ${sel===n?"selected":""}>${esc(n)}</option>`).join("")}
    </select></label>
  ${names.length===0?`<div class="note-small" style="margin:-8px 0 14px">個人を選んで共有するには、相手が一度WorkHubを開いて名前登録している必要があります。</div>`:""}`;
}
function readShare(prefix){
  const v=document.getElementById(prefix+"_mode").value;
  if(v==="none"||v==="all") return {shareMode:v, shareWith:[]};
  return {shareMode:"select", shareWith:[v]};
}
// 作成後の共有設定変更（モーダル）
function openShareEditor(type,id){
  const list={events:S.events,tasks:S.tasks,notes:S.notes,adjustments:S.adjustments}[type];
  const it=list.find(x=>x.id===id);
  if(it.createdBy && it.createdBy!==CURRENT_USER){ notify("共有設定を変更できるのは作成者のみです", true); return; }
  const mode = it.shareMode!==undefined ? it.shareMode : (it.shared ? "all" : "none");
  const cur = mode==="select" ? (it.shareWith||[])[0]||"none" : mode;
  const ov=document.createElement("div");
  ov.className="overlay";
  ov.innerHTML=`<div class="modal"><h2>共有設定</h2><p>「${esc(it.title)}」を誰に共有しますか？</p>
    ${shareControlHtml("se", cur)}
    <div style="display:flex;gap:10px">
      <button class="prim" id="se_save">保存</button>
      <button class="ghost" id="se_cancel">キャンセル</button></div></div>`;
  ov.querySelector("#se_save").addEventListener("click",()=>{
    const sh=readShare("se");
    it.shareMode=sh.shareMode; it.shareWith=sh.shareWith; it.shared=(sh.shareMode!=="none");
    persist(type,it); ov.remove(); render();
    notify(sh.shareMode==="all"?"全員に共有しました":sh.shareMode==="select"?`${sh.shareWith.length}名に共有しました`:"自分のみ表示にしました");
  });
  ov.querySelector("#se_cancel").addEventListener("click",()=>ov.remove());
  document.body.appendChild(ov);
}

function confirmCandidate(adjId,candId){
  const adj=S.adjustments.find(a=>a.id===adjId);
  const c=adj.candidates.find(x=>x.id===candId);
  const [h,m]=c.time.split(":").map(Number);
  const mins=h*60+m+adj.duration;
  const end=`${pad(Math.floor(mins/60)%24)}:${pad(mins%60)}`;
  const ev={id:Date.now(), title:adj.title, date:c.date, start:c.time, end, place:"", auto:true,
    createdBy:CURRENT_USER, shareMode:"none", shareWith:[], shared:false};
  S.events.push(ev);
  adj.status="確定"; adj.confirmed=`${fmtMD(c.date)} ${c.time}`;
  persist("events", ev); persist("adjustments", adj);
  selDate=c.date;
  const d=new Date(c.date+"T00:00:00");
  viewMonth={y:d.getFullYear(), m:d.getMonth()};
  render();
  notify(`「${adj.title}」を確定し、スケジュールに自動登録しました`);
}

function createNoteFromEvent(evId){
  const ev=S.events.find(e=>e.id===evId);
  appUI.note={title:`${ev.title} 議事録`, date:ev.date, start:ev.start||"", end:ev.end||"", todos:[{}]};
  tab="notes"; render();
}

function saveNote(){
  const title=document.getElementById("nf_title").value.trim();
  if(!title) return;
  const date=document.getElementById("nf_date").value||toISO(T);
  const start=document.getElementById("nf_start").value;
  const end=document.getElementById("nf_end").value;
  const decisions=document.getElementById("nf_dec").value.trim();
  const memo=document.getElementById("nf_memo").value.trim();
  const participants=noteParticipants();
  const todos=[];
  document.querySelectorAll("#nf_todos .todo-line").forEach(line=>{
    const ti=line.querySelector(".td-text");
    const di=line.querySelector(".td-due");
    const wi=line.querySelector(".td-who");
    if(ti&&ti.value.trim()) todos.push({text:ti.value.trim(), due:di.value, who:(wi&&wi.value)||CURRENT_USER});
  });
  const shN=readShare("nf");
  const note={id:Date.now(), title, date, start, end, decisions, memo, todos, participants, author:CURRENT_USER,
    createdBy:CURRENT_USER, shareMode:shN.shareMode, shareWith:shN.shareWith, shared:shN.shareMode!=="none"};
  S.notes.unshift(note);
  persist("notes", note);
  todos.forEach((t,i)=>{
    const task={id:Date.now()+i+1, title:t.text, due:t.due||addDays(T,7),
      alert:t.due?addDays(t.due,-7):toISO(T), memo:`「${title}」より自動登録`, done:false, from:"note", assignee:t.who,
      createdBy:CURRENT_USER, shared:false};
    S.tasks.push(task);
    persist("tasks", task);
  });
  appUI.note=null; openNote=note.id;
  render();
  notify(todos.length>0 ? `議事録を保存し、ToDo ${todos.length}件を担当者のタスクに自動登録しました` : "議事録を保存しました");
}

function answerUrlOf(adj){
  if(!CONFIG.answerUrl) return "";
  return `${CONFIG.answerUrl}${CONFIG.answerUrl.includes("?")?"&":"?"}id=${adj.id}`;
}
function copyUrl(adjId){
  const adj=S.adjustments.find(a=>a.id===adjId);
  const url=answerUrlOf(adj);
  const done=()=>notify("コピーしました");
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done)); }
  else fallbackCopy(url,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text; document.body.appendChild(ta); ta.select();
  document.execCommand("copy"); document.body.removeChild(ta); done();
}

function saveResp(adjId){

  const answers={};

  const adj=S.adjustments.find(a=>a.id===adjId);
  adj.responses=(adj.responses||[]).filter(r=>r.name!==name);
  adj.responses.push({name, answers});
  persist("adjustments", adj);

  notify(`${name} の回答を記録しました`);

function calPanelHtml(compact){
  const first=new Date(viewMonth.y,viewMonth.m,1);
  const last=new Date(viewMonth.y,viewMonth.m+1,0).getDate();
  const byDate=eventsByDate();
  const tByDate=tasksByDate();
  let cal="";
  WD.forEach((w,i)=>cal+=`<div class="calw ${i===0?"sun":i===6?"sat":""}">${w}</div>`);
  for(let i=0;i<first.getDay();i++) cal+=`<div></div>`;
  for(let d=1;d<=last;d++){
    const iso=toISO(new Date(viewMonth.y,viewMonth.m,d));
    const evs=byDate[iso]||[];
    const tks=tByDate[iso]||[];
    const dots=[...evs.map(()=>"ev"),...tks.map(()=>"tk")].slice(0,3);
    cal+=`<button class="cell ${iso===toISO(T)?"today":""} ${iso===selDate?"sel":""}" onclick="selDate='${iso}';render()">
      <span>${d}</span>${dots.length>0?`<span class="dots">${dots.map(k=>`<span class="dot" style="${k==="tk"?"background:#E8A23D":""}"></span>`).join("")}</span>`:""}</button>`;
  }
  let html=`<div class="calhead">
    <button class="arr" onclick="viewMonth.m===0?(viewMonth={y:viewMonth.y-1,m:11}):(viewMonth.m--);render()">‹</button>
    <b>${viewMonth.y}年 ${viewMonth.m+1}月</b>
    <button class="arr" onclick="viewMonth.m===11?(viewMonth={y:viewMonth.y+1,m:0}):(viewMonth.m++);render()">›</button>
  </div><div class="cal">${cal}</div>`;
  const dayEvents=byDate[selDate]||[];
  const dayTasks=tByDate[selDate]||[];
  if(compact){
    html+=`<div class="dayhead"><b>${fmtMD(selDate)} の予定</b></div>`;
    if(dayEvents.length===0 && dayTasks.length===0) html+=`<div class="empty" style="padding:16px;font-size:14px">予定はありません</div>`;
    dayEvents.forEach(e=>{
      html+=`<div class="ev" style="padding:11px 13px"><div class="time">${e.start||"終日"}</div>
        <div class="body"><div class="name" style="font-size:15px">${esc(e.title)}${e.auto?`<span class="autotag">自動</span>`:""}</div></div></div>`;
    });
    dayTasks.forEach(t=>{
      html+=`<div class="ev" style="padding:11px 13px;cursor:pointer" onclick="tab='tasks';render()"><div class="time" style="color:#D96C30">〆切</div>
        <div class="body"><div class="name" style="font-size:15px">${esc(t.title)}${t.assignee?`<span class="whotag">${esc(t.assignee)}</span>`:""}</div></div></div>`;
    });
  }
  return html;
}

function upcomingSideHtml(){
  const upcoming=visEvents().filter(e=>daysUntil(e.date)>=0).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||""))).slice(0,6);
  const nearTasks=visTasks().filter(t=>!t.done).sort((a,b)=>new Date(a.due)-new Date(b.due)).slice(0,6);

function dueBadge(t){
  const n=daysUntil(t.due);
  if(t.done) return ["完了","#EEF1F3","#8A93A2"];
  if(n<0) return [`${-n}日超過`,"#C24545","#fff"];
  if(n===0) return ["本日","#D96C30","#fff"];
  if(n<=3) return [`あと${n}日`,"#E8A23D","#fff"];
  return [`あと${n}日`,"var(--as)","var(--ad)"];
}

function render(){
  document.getElementById("nav").innerHTML = NAV.map(([id,label])=>

    if(open){
      const answered=(adj.responses||[]).map(r=>r.name);
      html+=`<div style="padding:0 18px 18px"><div class="meta">所要 ${adj.duration}分 ｜ 回答 ${answered.length}名${adj.status==="確定"?` ｜ 確定：${adj.confirmed}`:""}</div>`;
      if((adj.participants||[]).length){
        html+=`<div class="rstat">${adj.participants.map(p=>
          `<span class="rchip ${answered.includes(p)?"ok":"wait"}">${answered.includes(p)?"✓ ":""}${esc(p)}${answered.includes(p)?"":"（未回答）"}</span>`).join("")}</div>`;
      }
      const url=adj.status==="調整中" && REMOTE ? answerUrlOf(adj) : "";
      if(url){
        html+=`<div class="urlrow"><input readonly value="${esc(url)}" onclick="this.select()">
          <button class="miniA" onclick="copyUrl(${adj.id})">URLをコピー</button></div>`;
      }
      const scores=adj.candidates.map(c=>(adj.responses||[]).reduce((s,r)=>s+(MARK[r.answers[c.id]]??0),0));
      const max=Math.max(...scores);
      const canConfirm=(adj.responses||[]).length>0;
      adj.candidates.forEach((c,i)=>{
        const best=canConfirm && scores[i]===max && adj.status==="調整中";
        html+=`<div class="cand ${best?"best":""}"><div style="flex:1">
          <div style="font-weight:700;font-size:15px">${fmtMD(c.date)} ${c.time}${best?`<span class="besttag">最有力</span>`:""}</div>
          <div style="font-size:14px;color:var(--gray);margin-top:3px">${(adj.responses||[]).length===0?"回答待ち":(adj.responses||[]).map(r=>`${esc(r.name)}:${r.answers[c.id]||"−"}`).join("　")}</div></div>
          ${adj.status==="調整中"?(canConfirm
            ?`<button class="confirm" onclick="confirmCandidate(${adj.id},'${c.id}')">この日時で確定</button>`
            :`<button class="confirm" disabled title="相手の回答が届くまで確定できません">回答待ち</button>`):""}</div>`;
      });
      if(adj.status==="調整中"){
        if(!canConfirm) html+=`<div class="note-small" style="margin-bottom:8px">⚠ 相手の回答が入力されるまで確定ボタンは押せません。${REMOTE?"回答が届いたら「↻ 更新」で反映されます。":""}</div>`;
        if(appUI.resp===adj.id){
          html+=`<div class="form" style="margin-top:10px;margin-bottom:6px">
            <div class="ft" style="font-size:15px">回答の入力（電話等で届いた回答を代理で記録）</div>
            <label>回答者名<span class="req">必須</span><input id="rf_name" placeholder="例）田中様（A社）"></label>
            ${adj.candidates.map(c=>`<label>${fmtMD(c.date)} ${c.time}
              <select class="rf_ans" data-cid="${c.id}" style="width:130px">
                <option value="○">○ 参加可</option><option value="△">△ 微妙</option><option value="×">× 不可</option>
              </select></label>`).join("")}
            <div style="display:flex;gap:10px">
              <button class="prim" onclick="saveResp(${adj.id})">回答を記録</button>
              <button class="ghost" onclick="appUI.resp=null;render()">閉じる</button></div></div>`;
        } else {
          html+=`<button class="ghost" style="margin-top:4px" onclick="appUI.resp=${adj.id};render()">＋ 回答を代理入力</button>`;
        }
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  return html;
}

function createAdj(){
  const title=document.getElementById("af_title").value.trim();
  const dur=+document.getElementById("af_dur").value;
  const participants=[];
  document.querySelectorAll("#af_parts .part-line").forEach(line=>{
    const sei=line.querySelector(".p-sei").value.trim();
    const mei=line.querySelector(".p-mei").value.trim();
    const full=[sei,mei].filter(Boolean).join(" ");
    if(full) participants.push(full);
  });
  const cands=[];
  document.querySelectorAll("#af_cands .cand-line").forEach((line,i)=>{
    const d=line.querySelector("input");
    const t=line.querySelector("select");
    if(d.value&&t.value) cands.push({id:"n"+i, date:d.value, time:t.value});
  });
  if(!title||cands.length===0){ notify("件名と候補日時を入力してください"); return; }
  const shA=readShare("af");
  const adj={id:Date.now(), title, duration:dur, status:"調整中", participants, candidates:cands, responses:[], owner:CURRENT_USER,
    createdBy:CURRENT_USER, shareMode:shA.shareMode, shareWith:shA.shareWith, shared:shA.shareMode!=="none"};
  S.adjustments.push(adj);
  persist("adjustments", adj);
  appUI.adj=null; openAdj=adj.id; render();
  notify(REMOTE?"調整案件を作成しました。回答用URLをコピーして相手に送ってください":"調整案件を作成しました");
}

function renderSchedule(){
  const byDate=eventsByDate();
  const dayEvents=byDate[selDate]||[];
  const dayTasks=(tasksByDate()[selDate]||[]);
  let html=`<div>${calPanelHtml(false)}
    <div class="dayhead"><b>${fmtMD(selDate)} の予定</b>
      <button class="sp" onclick="appUI.ev={};render()">＋ 予定追加</button></div>`;
  if(appUI.ev){
    html+=`<div class="form">
      <label>件名<span class="req">必須</span><input id="ef_title" placeholder="例）C社 打ち合わせ"></label>
      <div class="row">
        <label>日付<input type="date" id="ef_date" value="${selDate}"></label>
        <label>開始${clockSelectHtml("ef_start")}</label>
        <label>終了${clockSelectHtml("ef_end")}</label></div>
      <label>場所・URL<input id="ef_place" placeholder="例）会議室A / Zoom"></label>
      ${shareControlHtml("ef","none")}
      <div style="display:flex;gap:10px">
        <button class="prim" onclick="addEvent()">登録する</button>
        <button class="ghost" onclick="appUI.ev=null;render()">閉じる</button></div></div>`;
  }
  if(dayEvents.length===0 && dayTasks.length===0 && !appUI.ev) html+=`<div class="empty">この日の予定はありません</div>`;
  dayEvents.forEach(e=>{
    html+=`<div class="ev"><div class="time">${e.start||"終日"}${e.end?`〜${e.end}`:""}</div>
      <div class="body"><div class="name">${esc(e.title)}${e.auto?`<span class="autotag">調整から自動登録</span>`:""}${shareTag(e)}${e.owner?`<span class="whotag">${esc(e.owner)}</span>`:""}</div>
      ${e.place?`<div class="place">📍 ${esc(e.place)}</div>`:""}</div>
      <div class="btncol"><button class="miniA" onclick="createNoteFromEvent(${e.id})">議事録作成</button>
      <button class="mini" onclick="openShareEditor('events',${e.id})">共有設定</button>
      <button class="mini" onclick="S.events=S.events.filter(x=>x.id!==${e.id});removeIt('events',${e.id});render()">削除</button></div></div>`;
  });
  dayTasks.forEach(t=>{
    html+=`<div class="ev" style="cursor:pointer;background:#FFFDF8" onclick="tab='tasks';render()">
      <div class="time" style="color:#D96C30">〆切</div>
      <div class="body"><div class="name">${esc(t.title)}${t.assignee?`<span class="whotag">担当:${esc(t.assignee)}</span>`:""}</div></div>
      <span style="font-size:12px;color:#AEB7C0;flex-shrink:0">タスクへ ›</span></div>`;
  });
  return html+`</div>`;
}

function addEvent(){
  const title=document.getElementById("ef_title").value.trim();
  const date=document.getElementById("ef_date").value;
  if(!title||!date){ notify("件名と日付を入力してください"); return; }
  const ev={id:Date.now(), title, date,
    start:document.getElementById("ef_start").value, end:document.getElementById("ef_end").value,
    place:document.getElementById("ef_place").value.trim(), auto:false, owner:CURRENT_USER,
    createdBy:CURRENT_USER, ...(()=>{const sh=readShare("ef");return {shareMode:sh.shareMode, shareWith:sh.shareWith, shared:sh.shareMode!=="none"};})()};
  S.events.push(ev);
  persist("events", ev);
  appUI.ev=null; selDate=date; render();
}

function renderTasks(){
  const sorted=[...visTasks()].sort((a,b)=>a.done!==b.done?(a.done?1:-1):new Date(a.due)-new Date(b.due));
  let html=`${alertTasksHtml(false)}`;
  if(!appUI.task){
    html+=`<button class="addbtn" onclick="appUI.task={};render()">＋ タスクを登録</button>`;
  } else {
    html+=`<div class="form">
      <label>件名<span class="req">必須</span><input id="tf_title" placeholder="例）A社 提案資料の原案提出"></label>
      <div class="row">
        <label>期日<span class="req">必須</span><input type="date" id="tf_due" onchange="const a=document.getElementById('tf_alert'); if(!a.value&&this.value){const d=new Date(this.value+'T00:00:00');d.setDate(d.getDate()-7);a.value=d.toISOString().slice(0,10)}"></label>
        <label>アラート日（既定：7日前）<input type="date" id="tf_alert"></label></div>
      <label>メモ<input id="tf_memo"></label>
      ${shareControlHtml("tf","none")}
      <div style="display:flex;gap:10px">
        <button class="prim" onclick="addTask()">登録する</button>
        <button class="ghost" onclick="appUI.task=null;render()">閉じる</button></div></div>`;
  }
  html+=`<div class="seclabel">タスク一覧（期日が近い順）</div>`;
  if(sorted.length===0) html+=`<div class="empty">タスクはありません</div>`;
  sorted.forEach(t=>{
    const [text,bg,color]=dueBadge(t);
    html+=`<div class="card task ${t.done?"done":""}">
      <span class="badge" style="background:${bg};color:${color}">${text}</span>
      <div style="flex:1;min-width:0"><div class="tname">${esc(t.title)}${t.assignee?` <span class="whotag">担当:${esc(t.assignee)}</span>`:""}${t.from==="note"?` <span class="autotag">議事録から自動登録</span>`:""}${shareTag(t)}</div>
      <div class="tmeta">期日 ${fmtMD(t.due)} ｜ アラート ${fmtMD(t.alert)}</div>
      ${t.memo?`<div class="tmemo">${esc(t.memo)}</div>`:""}</div>
      <div class="btncol"><button class="miniA" onclick="toggleTask(${t.id})">${t.done?"戻す":"完了"}</button>
      <button class="mini" onclick="openShareEditor('tasks',${t.id})">共有設定</button>
      <button class="mini" onclick="S.tasks=S.tasks.filter(x=>x.id!==${t.id});removeIt('tasks',${t.id});render()">削除</button></div></div>`;
  });
  return html;
}

function toggleTask(id){
  const x=S.tasks.find(x=>x.id===id);
  x.done=!x.done;
  persist("tasks", x);
  render();
}

function addTask(){
  const title=document.getElementById("tf_title").value.trim();
  const due=document.getElementById("tf_due").value;
  if(!title||!due){ notify("件名と期日を入力してください"); return; }
  const alert=document.getElementById("tf_alert").value||addDays(due,-7);
  const task={id:Date.now(), title, due, alert, memo:document.getElementById("tf_memo").value.trim(), done:false, from:null, assignee:"",
    createdBy:CURRENT_USER, ...(()=>{const sh=readShare("tf");return {shareMode:sh.shareMode, shareWith:sh.shareWith, shared:sh.shareMode!=="none"};})()};
  S.tasks.push(task);
  persist("tasks", task);
  appUI.task=null; render();
}

function renderNotes(){
  let html=`<div class="fade" style="max-width:860px;margin:0 auto">`;
  if(!appUI.note){
    html+=`<button class="addbtn" onclick="appUI.note={title:'',date:'${toISO(T)}',todos:[{}]};render()">＋ 議事録を作成</button>`;
  } else {
    const f=appUI.note;
    html+=`<div class="form"><div class="ft">議事録の作成</div>
      <label>タイトル<span class="req">必須</span><input id="nf_title" value="${esc(f.title||"")}" placeholder="例）A社 提案会議 議事録"></label>
      <div class="row">
        <label>日付<input type="date" id="nf_date" value="${f.date||toISO(T)}"></label>
        <label>開始${clockSelectHtml("nf_start", f.start)}</label>
        <label>終了${clockSelectHtml("nf_end", f.end)}</label>
      </div>
      <label>参加者（カンマ「,」で区切る）<input id="nf_part" value="${esc(f.participants!==undefined?f.participants:CURRENT_USER)}" placeholder="例）山田 太郎, 田中 花子" oninput="refreshTodoWho()"></label>
      <label>決定事項<textarea id="nf_dec" rows="3" placeholder="会議で決まったこと"></textarea></label>
      <label>ToDo（保存するとタスクへ自動登録され、担当者のタスク一覧に反映されます）</label>
      <div id="nf_todos">${(f.todos||[{}]).map(()=>todoLineHtml()).join("")}</div>
      <button class="ghost" style="margin-bottom:14px" onclick="addTodoLine()">＋ ToDoを追加</button>
      <label>メモ<textarea id="nf_memo" rows="2"></textarea></label>
      ${shareControlHtml("nf","none")}
      <div class="note-small" style="margin:-8px 0 14px">※ 参加者に入力した人には、共有範囲に関わらずこの議事録が表示されます。</div>
      <div style="display:flex;gap:10px">
        <button class="prim" onclick="saveNote()">保存する</button>
        <button class="ghost" onclick="appUI.note=null;render()">閉じる</button></div></div>`;
  }
  if(visNotes().length===0 && !appUI.note) html+=`<div class="empty">議事録はありません</div>`;
  visNotes().slice().sort((a,b)=>b.id-a.id).forEach(n=>{
    const open=openNote===n.id;
    html+=`<div class="card"><button class="chead" onclick="openNote=${open?"null":n.id};render()">
      <span style="font-size:14px;color:var(--gray);flex-shrink:0">${fmtMD(n.date)}${n.start?` ${n.start}${n.end?`〜${n.end}`:""}`:""}</span>
      <span class="title">${esc(n.title)} ${shareTag(n)}</span>${n.author?`<span class="whotag">${esc(n.author)}</span>`:""}<span style="color:#AEB7C0">${open?"▲":"▼"}</span></button>`;
    if(open){
      html+=`<div style="padding:0 18px 18px">`;
      if((n.participants||[]).length) html+=`<div class="nl">参加者</div><div class="nb">${n.participants.map(esc).join("、")}</div>`;
      if(n.decisions) html+=`<div class="nl">決定事項</div><div class="nb">${esc(n.decisions)}</div>`;
      if(n.todos.length>0){
        html+=`<div class="nl">ToDo</div>`;
        n.todos.forEach(td=>html+=`<div class="nb">・${esc(td.text)}${td.who?`　<span class="whotag">担当:${esc(td.who)}</span>`:""}${td.due?`（期日 ${fmtMD(td.due)}）`:""} <span style="color:var(--ad);font-size:12px;font-weight:700">→ タスク登録済み</span></div>`);
      }
      if(n.memo) html+=`<div class="nl">メモ</div><div class="nb">${esc(n.memo)}</div>`;
      html+=`<button class="mini" style="margin-top:10px;margin-right:8px" onclick="openShareEditor('notes',${n.id})">共有設定</button><button class="mini" style="margin-top:10px" onclick="S.notes=S.notes.filter(x=>x.id!==${n.id});removeIt('notes',${n.id});render()">削除</button></div>`;
    }
    html+=`</div>`;
  });
  return html+`</div>`;
}
