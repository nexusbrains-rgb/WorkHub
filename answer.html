<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0AB1B6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkHub">
<title>日程のご回答</title>
<style>
  :root { --a:#0AB1B6; --ad:#078F93; --as:#E6F7F7; --border:#E4E8EC; --gray:#7A8494; }
  * { box-sizing:border-box; }
  body { margin:0; background:#F6F9FA; color:#1C242C; font-size:16px;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  .logo { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; margin-bottom:18px;
    color:inherit; text-decoration:none; cursor:pointer; width:fit-content; }
  .logo:active { opacity:.7; }
  .logo::before { content:""; width:12px; height:26px; border-radius:6px; background:linear-gradient(180deg,var(--a),var(--ad)); }
  .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 20px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 6px; }
  .meta { font-size:14px; color:var(--gray); margin-bottom:4px; }
  label { display:block; font-size:14px; font-weight:700; color:#5B6675; margin:16px 0 6px; }
  select, input { width:100%; padding:12px 13px; border-radius:10px; border:1px solid #D8DEE4; font-size:16px; font-family:inherit; background:#fff; }
  select:focus, input:focus { outline:none; border-color:var(--a); box-shadow:0 0 0 3px var(--as); }
  .cand { border:1px solid var(--border); border-radius:12px; padding:14px 15px; margin-top:10px; }
  .cand .dt { font-size:17px; font-weight:800; margin-bottom:10px; }
  .opts { display:flex; gap:8px; }
  .opt { flex:1; padding:12px 0; border-radius:10px; border:1.5px solid #D8DEE4; background:#fff; font-size:18px; font-weight:800; cursor:pointer; font-family:inherit; color:#5B6675; }
  .opt.on-maru { border-color:var(--a); background:var(--as); color:var(--ad); }
  .opt.on-sankaku { border-color:#E8A23D; background:#FDF3E3; color:#9A6A1F; }
  .opt.on-batsu { border-color:#C24545; background:#FBEEEE; color:#C24545; }
  .send { width:100%; margin-top:20px; padding:16px; border-radius:12px; border:none; background:var(--a); color:#fff; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit; }
  .send:disabled { background:#C9D1D8; cursor:not-allowed; }
  .done { text-align:center; padding:40px 20px; }
  .done .mark { font-size:52px; margin-bottom:12px; }
  .note { font-size:13px; color:var(--gray); line-height:1.8; margin-top:14px; }
  .err { background:#FBEEEE; border:1px solid #E5C4C4; color:#8A3232; border-radius:10px; padding:13px 15px; font-size:14px; margin-top:12px; }
  .loading { text-align:center; color:var(--gray); padding:50px 0; }
  footer { text-align:center; font-size:12px; color:#AEB7C0; padding:10px; }
  .meeturl { margin-top:14px; background:#F3FAFA; border:1px solid #CDEBEC; border-radius:10px; padding:12px 16px; text-align:left; }
  .meeturl .ml { font-size:12px; font-weight:800; color:#078F93; letter-spacing:.06em; margin-bottom:4px; }
  .meeturl a { color:#078F93; font-weight:700; word-break:break-all; }
  .gbtn { display:inline-block; margin-top:16px; background:var(--a); color:#fff; border-radius:10px;
    padding:13px 22px; font-weight:800; text-decoration:none; font-size:15px; }
  .cnt { font-size:12px; font-weight:800; color:#5B6675; background:#F3F6F8; border-radius:6px; padding:2px 8px; margin-left:10px; vertical-align:1px; }
  .others { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 8px; }
  .oc { font-size:12px; font-weight:700; border-radius:6px; padding:3px 9px; background:#F6F8F9; color:#5B6675; border:1px solid #E4E8EC; }
  .oc.o-maru { background:#E9F7F0; color:#1B7A4C; border-color:#CDEBDC; }
  .oc.o-sankaku { background:#FDF6E5; color:#9A6A1F; border-color:#F2E2BC; }
  .oc.o-batsu { background:#FBEEEE; color:#B44A4A; border-color:#F0D4D4; }
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="./index.html">WorkHub 日程調整</a>
  <div id="app"><div class="loading">読み込んでいます…</div></div>
</div>
<footer>Powered by Kiasu Co., Ltd.</footer>

<script>
"use strict";
// ▼▼▼ 設置時にGASのURLを設定してください ▼▼▼
const GAS_URL = "https://script.google.com/macros/s/AKfycbzYhCX_LEb2jLETeNMIjiOzo3QQOGRaPpBqmDQiChXjSdaOmik3kvnrZh3VmwVgYItz7g/exec";
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const WD=["日","月","火","水","木","金","土"];
const fmtMD = iso => { const d=new Date(iso+"T00:00:00"); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");
let ADJ = null;
const answers = {};

async function init(){
  const id = new URLSearchParams(location.search).get("id");
  if(!GAS_URL){ app.innerHTML = `<div class="card"><div class="err">このページはまだ設定が完了していません（GAS URL未設定）。主催者にご連絡ください。</div></div>`; return; }
  if(!id){ app.innerHTML = `<div class="card"><div class="err">URLが正しくありません。主催者から届いたURLをそのままお開きください。</div></div>`; return; }
  try{
    const r = await fetch(`${GAS_URL}?action=adj&id=${encodeURIComponent(id)}`);
    const data = await r.json();
    if(!data.ok){ throw new Error(data.error==="not_found" ? "この調整は見つかりませんでした（終了した可能性があります）" : "読み込みに失敗しました"); }
    ADJ = data.adj;
    if(ADJ.status !== "調整中"){
      // 確定済み：会議情報とカレンダー登録リンクを表示
      let gcal="";
      if(ADJ.confirmedDate && ADJ.confirmedTime){
        const ds=ADJ.confirmedDate.replace(/-/g,"");
        const s=ds+"T"+ADJ.confirmedTime.replace(":","")+"00";
        let e;
        if(ADJ.confirmedEnd){ e=ds+"T"+ADJ.confirmedEnd.replace(":","")+"00"; }
        else{
          const [h,m]=ADJ.confirmedTime.split(":").map(Number);
          const mins=h*60+m+(+ADJ.duration||60);
          e=ds+"T"+String(Math.floor(mins/60)%24).padStart(2,"0")+String(mins%60).padStart(2,"0")+"00";
        }
        const u="https://calendar.google.com/calendar/render?action=TEMPLATE"
          +"&text="+encodeURIComponent(ADJ.title)
          +"&dates="+s+"/"+e
          +(ADJ.meetUrl?"&location="+encodeURIComponent(ADJ.meetUrl):"")
          +"&details="+encodeURIComponent("日程調整により確定した予定です。"+(ADJ.meetUrl?"\n会議URL・場所："+ADJ.meetUrl:""));
        gcal=`<a class="gbtn" href="${u}" target="_blank" rel="noopener">Googleカレンダーに登録</a>`;
      }
      const isLink=/^https?:\/\//.test(ADJ.meetUrl||"");
      app.innerHTML = `<div class="card done"><div class="mark">📅</div><h1>この日程は確定済みです</h1>
        <div class="meta" style="margin-top:10px"><b style="font-size:17px;color:#1C242C">${esc(ADJ.title)}</b><br>
        確定日時：${esc(ADJ.confirmed||"")}${ADJ.duration?`（${ADJ.duration}分）`:""}</div>
        ${ADJ.meetUrl?`<div class="meeturl"><div class="ml">会議URL・場所</div>${isLink?`<a href="${esc(ADJ.meetUrl)}" target="_blank" rel="noopener">${esc(ADJ.meetUrl)}</a>`:`<div>${esc(ADJ.meetUrl)}</div>`}</div>`:""}
        ${gcal}
      </div>`;
      return;
    }
    renderForm();
  }catch(e){
    app.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`;
  }
}

function renderForm(){
  const answered = (ADJ.responses||[]).map(r=>r.name);
  const participants = ADJ.participants||[];
  app.innerHTML = `
    <div class="card">
      <h1>${esc(ADJ.title)}</h1>
      <div class="meta">所要時間：${ADJ.duration}分</div>
      ${answered.length?`<div class="meta">回答済み：${answered.map(esc).join("、")}</div>`:""}
      <label>お名前</label>
      ${participants.length?`
        <select id="nameSel">
          <option value="">選択してください</option>
          ${participants.map(p=>`<option value="${esc(p)}">${esc(p)}${answered.includes(p)?"（回答済み）":""}</option>`).join("")}
          <option value="__other__">その他（名前を入力）</option>
        </select>
        <input id="nameInput" placeholder="お名前を入力" style="display:none;margin-top:8px">`
      :`<input id="nameInput" placeholder="お名前を入力">`}
      <div class="note" id="restoreNote" style="display:none;color:#078F93;font-weight:700">前回のご回答を表示しています。変更して再送信すると上書きされます。</div>
      <label>各候補のご都合をタップしてください</label>
      ${ADJ.candidates.map(c=>{
        const rs=(ADJ.responses||[]).map(r=>({name:r.name, v:r.answers[c.id]})).filter(x=>x.v);
        const cnt={"○":0,"△":0,"×":0};
        rs.forEach(x=>{ if(cnt[x.v]!==undefined) cnt[x.v]++; });
        return `
        <div class="cand">
          <div class="dt">${fmtMD(c.date)} ${c.time}〜${rs.length?`<span class="cnt">○${cnt["○"]}　△${cnt["△"]}　×${cnt["×"]}</span>`:""}</div>
          ${rs.length?`<div class="others">${rs.map(x=>`<span class="oc ${x.v==="○"?"o-maru":x.v==="△"?"o-sankaku":"o-batsu"}">${esc(x.name)} ${x.v}</span>`).join("")}</div>`:""}
          <div class="opts" data-cid="${c.id}">
            <button class="opt" data-v="○">○</button>
            <button class="opt" data-v="△">△</button>
            <button class="opt" data-v="×">×</button>
          </div>
        </div>`;
      }).join("")}
      <button class="send" id="sendBtn" disabled>回答を送信する</button>
      <div class="note">※ 登録・ログインは不要です。皆さまのご回答は、この画面と主催者に共有されます。回答をやり直す場合は、同じ名前でもう一度送信してください。</div>
      <div id="errBox"></div>
    </div>`;

  const nameSel = document.getElementById("nameSel");
  const nameInput = document.getElementById("nameInput");
  if(nameSel){
    nameSel.addEventListener("change", ()=>{
      nameInput.style.display = nameSel.value==="__other__" ? "block" : "none";
      restoreAnswers(nameSel.value);
      updateSend();
    });
  }
  nameInput && nameInput.addEventListener("input", updateSend);

  document.querySelectorAll(".opts").forEach(box=>{
    box.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        answers[box.dataset.cid] = btn.dataset.v;
        box.querySelectorAll(".opt").forEach(b=>b.className="opt");
        btn.className = "opt " + (btn.dataset.v==="○"?"on-maru":btn.dataset.v==="△"?"on-sankaku":"on-batsu");
        updateSend();
      });
    });
  });

  document.getElementById("sendBtn").addEventListener("click", send);
}

function currentName(){
  const sel = document.getElementById("nameSel");
  const inp = document.getElementById("nameInput");
  if(sel && sel.value && sel.value!=="__other__") return sel.value;
  return inp ? inp.value.trim() : "";
}

// 名前を選んだとき、その人の前回回答があればボタンに復元する
function restoreAnswers(name){
  const r=(ADJ.responses||[]).find(x=>x.name===name);
  document.querySelectorAll(".opts").forEach(box=>{
    const v=r ? r.answers[box.dataset.cid] : null;
    box.querySelectorAll(".opt").forEach(b=>{
      b.className = "opt" + (v && b.dataset.v===v ? " " + (v==="○"?"on-maru":v==="△"?"on-sankaku":"on-batsu") : "");
    });
    if(v) answers[box.dataset.cid]=v;
    else delete answers[box.dataset.cid];
  });
  const note=document.getElementById("restoreNote");
  if(note) note.style.display = r ? "block" : "none";
}

function updateSend(){
  const allAnswered = ADJ.candidates.every(c=>answers[c.id]);
  document.getElementById("sendBtn").disabled = !(currentName() && allAnswered);
}

async function send(){
  const btn = document.getElementById("sendBtn");
  btn.disabled = true; btn.textContent = "送信中…";
  try{
    const r = await fetch(GAS_URL, {
      method:"POST", headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({ action:"respond", adjId:ADJ.id, name:currentName(), answers })
    });
    const data = await r.json();
    if(!data.ok) throw new Error(data.error==="closed" ? "この日程はすでに確定しています" : "送信に失敗しました");
    app.innerHTML = `<div class="card done"><div class="mark">✅</div><h1>回答を送信しました</h1>
      <div class="meta" style="margin-top:8px">${esc(ADJ.title)}<br>ご協力ありがとうございました。<br>日程が確定しましたら主催者からご連絡します。</div></div>`;
  }catch(e){
    btn.disabled = false; btn.textContent = "回答を送信する";
    document.getElementById("errBox").innerHTML = `<div class="err">${esc(e.message)}。通信環境をご確認のうえ再度お試しください。</div>`;
  }
}

init();
</script>
</body>
</html>
